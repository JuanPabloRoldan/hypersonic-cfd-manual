site_name: Hypersonic CFD Manual
site_description: A course and a lookup manual for entry aerothermodynamics, hypersonic numerics, thermochemistry and TPS analysis.
site_author: Juan Pablo Roldan
site_url: https://juanpabloroldan.github.io/hypersonic-cfd-manual/
repo_url: https://github.com/JuanPabloRoldan/hypersonic-cfd-manual
repo_name: hypersonic-cfd-manual
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips
  icon:
    repo: fontawesome/brands/github

extra:
  status:
    outline: Outline only, not yet taught
    draft: Partly written, lesson still pending

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      base_path: [includes]
      auto_append: [abbreviations.md]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home:
      - index.md
      - How to use this manual: how-to-use.md
  - Theory manual:
      - reference/index.md
      - Implications matrix: reference/implications-matrix.md
      - "1 Fundamental equations":
          - "1.1 Governing equations": reference/foundations/governing-equations.md
          - "1.2 Conservation form and weak solutions": reference/foundations/conservation-and-weak-solutions.md
          - "1.3 Mathematical character": reference/foundations/mathematical-character.md
          - "1.4 Closing the system": reference/foundations/closing-the-system.md
      - "2 Entry flow physics":
          - "2.1 Entry flow anatomy": reference/physics/entry-flow-anatomy.md
      - "3 Gas models and thermochemistry":
          - "3.1 Gas models": reference/thermo/gas-models.md
          - "3.2 Energy modes and thermodynamics": reference/thermo/energy-modes.md
          - "3.3 Thermal nonequilibrium": reference/thermo/thermal-nonequilibrium.md
          - "3.4 Finite-rate chemistry": reference/thermo/finite-rate-chemistry.md
          - "3.5 Transport and diffusion": reference/thermo/transport-and-diffusion.md
      - "4 Turbulence":
          - "4.1 Turbulence modeling for hypersonic boundary layers": reference/physics/turbulence-modeling.md
      - "5 Boundary conditions and walls":
          - "5.1 Boundary conditions": reference/spatial/boundary-conditions.md
          - "5.2 Wall boundary conditions": reference/walls/wall-boundary-conditions.md
          - "5.3 Surface energy balance": reference/walls/surface-energy-balance.md
      - "6 Spatial discretization":
          - "6.1 The finite-volume method": reference/spatial/finite-volume-pipeline.md
          - "6.2 Discretization families": reference/spatial/discretization-families.md
          - "6.3 Reconstruction and limiters": reference/spatial/reconstruction.md
          - "6.4 ENO, WENO and TENO": reference/spatial/weno.md
          - "6.5 Viscous fluxes and gradients": reference/spatial/viscous-fluxes.md
      - "7 Inviscid flux functions":
          - "7.1 Riemann solvers": reference/spatial/riemann-solvers.md
          - "7.2 Flux-vector splitting": reference/spatial/flux-vector-splitting.md
          - "7.3 Central schemes and dissipation": reference/spatial/central-schemes.md
          - "7.4 Low-Mach corrections": reference/spatial/low-mach-corrections.md
          - "7.5 Shock instabilities": reference/spatial/shock-instabilities.md
      - "8 Source terms":
          - "8.1 Stiff source terms": reference/sources/stiff-sources.md
      - "9 Time integration and solvers":
          - "9.1 Time-step limits": reference/time/time-step-limits.md
          - "9.2 Explicit methods": reference/time/explicit-methods.md
          - "9.3 Implicit methods and Jacobians": reference/time/implicit-methods.md
          - "9.4 Point and line relaxation": reference/time/relaxation-methods.md
          - "9.5 Local time stepping": reference/time/local-time-stepping.md
          - "9.6 Dual time stepping": reference/time/dual-time-stepping.md
          - "9.7 Explicit vs implicit": reference/time/explicit-vs-implicit.md
      - "10 Reduced equations":
          - "10.1 Space marching (PNS)": reference/special/space-marching.md
      - "11 Verification and diagnosis":
          - "11.1 Convergence diagnostics": reference/time/convergence-diagnostics.md
      - "Appendix":
          - "A Codes at a glance": codes/index.md
  - Course:
      - course/index.md
      - "Track 0 · Anatomy of a solver":
          - course/track-0/index.md
          - "0.1 Governing equations": course/track-0/0-1-governing-equations.md
          - "0.2 Spatial discretization": course/track-0/0-2-spatial-discretization.md
          - "0.3 Reconstruction": course/track-0/0-3-reconstruction.md
          - "0.4 Flux functions": course/track-0/0-4-flux-functions.md
          - "0.5 Time advancement": course/track-0/0-5-time-advancement.md
          - "0.6 Sources and stiffness": course/track-0/0-6-sources-and-stiffness.md
          - "0.7 Boundary conditions": course/track-0/0-7-boundary-conditions.md
          - "0.8 Verification and diagnosis": course/track-0/0-8-verification.md
      - "Track 1 · Entry flow physics": course/track-1.md
      - "Track 2 · Hypersonic numerics": course/track-2.md
      - "Track 3 · Time integration and cost": course/track-3.md
      - "Track 4 · Thermochemistry": course/track-4.md
      - "Track 5 · Walls and surfaces": course/track-5.md
      - "Track 6 · Shock-layer radiation": course/track-6.md
      - "Track 7 · TPS and material response": course/track-7.md
      - "Track 8 · V&V, uncertainty, margins": course/track-8.md
      - "Track 9 · The TPS design pipeline": course/track-9.md
      - Session log: course/session-log.md
  - Glossary: glossary.md
  - Bibliography: references.md
